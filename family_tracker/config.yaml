name: Housekeeper
version: "1.4.0"
slug: family_tracker
description: "Housekeeper: maintenance for home, garage & gear. Vehicles, parts, appliances, home tasks and seasonal checklists with reminders"
url: https://github.com/bniemeyer/family-tracker-ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:home-clock
panel_title: Housekeeper
homeassistant_api: true
backup: hot
options:
  notify_service: ""
  persistent_notification: true
  reminder_time: "06:30"
  due_window_days: 14
  repeat_days: 7
schema:
  notify_service: str?
  persistent_notification: bool
  reminder_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  due_window_days: int(1,90)
  repeat_days: int(1,30)
