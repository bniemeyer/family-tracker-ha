<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niemeyer Family Tracker</title>
<script>/* apply the last-seen appearance before first paint; the shared setting in meta/appearance wins once loaded */
(function(){var a=null;try{a=JSON.parse(localStorage.getItem("ft-appearance")||"null")}catch(e){}
var r=document.documentElement;r.dataset.theme=a&&a.theme==="classic"?"classic":"glass";r.dataset.mode=a&&(a.mode==="light"||a.mode==="dark")?a.mode:"auto"})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#f8f7f3; --ink:#1d1f22; --ink2:#5b6068; --ink3:#8a9099;
  --line:#e2dfd7; --accent:#d9480f; --accent-ink:#fff;
  --ok:#2f7d4f; --ok-bg:#e3f2e8; --soon:#a86400; --soon-bg:#fff1d6; --bad:#c22a2a; --bad-bg:#fde4e2; --na:#6b7078; --na-bg:#eceae5;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  color-scheme:light;
}
/* Classic dark: device setting in Auto mode, or forced Dark */
@media (prefers-color-scheme:dark){
  :root:not([data-mode=light]){color-scheme:dark;--bg:#141517;--panel:#1d1f22;--panel2:#24272b;--ink:#eceae5;--ink2:#a8adb5;--ink3:#7a8089;--line:#2f3237;
  --ok:#5cc489;--ok-bg:#183326;--soon:#f0b44c;--soon-bg:#3a2c12;--bad:#ff7a70;--bad-bg:#3d1b19;--na:#9aa0a8;--na-bg:#2a2d31;--shadow:none}
}
:root[data-mode=dark]{color-scheme:dark;--bg:#141517;--panel:#1d1f22;--panel2:#24272b;--ink:#eceae5;--ink2:#a8adb5;--ink3:#7a8089;--line:#2f3237;
  --ok:#5cc489;--ok-bg:#183326;--soon:#f0b44c;--soon-bg:#3a2c12;--bad:#ff7a70;--bad-bg:#3d1b19;--na:#9aa0a8;--na-bg:#2a2d31;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;letter-spacing:.01em;margin:0}
.mono{font-family:"JetBrains Mono",monospace;font-size:.9em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:34px;font-weight:700;text-transform:uppercase}
.top h1 span{color:var(--accent)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--soon)}.dot.bad{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-family:"Barlow Condensed";font-size:38px;font-weight:700;line-height:1}
.stat .l{color:var(--ink2);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.stat.bad .n{color:var(--bad)}.stat.soon .n{color:var(--soon)}.stat.ok .n{color:var(--ok)}
.upcoming{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 0;margin-bottom:26px;box-shadow:var(--shadow)}
.upcoming .row{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.upcoming .row+.row{border-top:1px solid var(--line)}
.upcoming .row:hover{background:var(--panel2)}
.upcoming .what{flex:1;min-width:0}
.upcoming .what b{font-weight:600}
.upcoming .empty{padding:12px 16px;color:var(--ink2)}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sechead h2{font-size:22px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s}
.card:hover{transform:translateY(-2px);border-color:var(--ink3)}
.ph{aspect-ratio:16/9;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:38%;height:auto;opacity:.35}
.ph .plate{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.92);color:#111;border:1px solid #bbb;border-radius:5px;padding:1px 7px;font:500 12px "JetBrains Mono",monospace}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{font-size:21px;line-height:1.1}
.cb .sub{color:var(--ink2);font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.soon{background:var(--soon-bg);color:var(--soon)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.na{background:var(--na-bg);color:var(--na)}
details.gone{margin-top:30px}
details.gone summary{cursor:pointer;font-family:"Barlow Condensed";font-size:20px;text-transform:uppercase;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
details.gone summary::before{content:"▸";transition:transform .15s}
details.gone[open] summary::before{transform:rotate(90deg)}
details.gone .grid{margin-top:12px}
.card.isgone{opacity:.75}
.note{color:var(--ink2);font-size:13px}
.banner{background:var(--soon-bg);color:var(--soon);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}}
.hero .ph{border-radius:var(--radius);border:1px solid var(--line)}
.phactions{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center}
.pastehint{font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:3px 7px}
.ph.drop{outline:3px dashed var(--accent);outline-offset:-6px}
.hinfo{display:flex;flex-direction:column;gap:12px}
.hinfo h1{font-size:40px;line-height:1;text-transform:uppercase}
.hinfo .sub{color:var(--ink2)}
.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.st .v{font-weight:600;margin-top:2px}
.st .badge{margin-top:6px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;text-transform:uppercase;margin-bottom:10px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;align-items:center}
.kv .k{color:var(--ink2);font-size:13.5px}
.kv .v{min-width:0;overflow-wrap:anywhere}
.kv input,.kv select,.form input,.form select,.form textarea{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.kv input:focus,.form input:focus,.form textarea:focus,.form select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--ink3)}
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .d{font-weight:600}
.entry .m{color:var(--ink2);font-size:13px}
.entry .t{font-weight:600}
.entry .x{color:var(--ink2);font-size:13.5px;white-space:pre-wrap}
.cat{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px;background:var(--panel2);border-radius:12px;margin-bottom:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--panel);border-radius:var(--radius);padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.loading{padding:40px;text-align:center;color:var(--ink2)}
/* tracker shell */
.brand{display:flex;flex-direction:column;gap:10px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:6px 13px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;border:1px solid transparent}
.nav a:hover{border-color:var(--line);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav a .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11.5px;text-align:center}
.nav a .cnt.soon{background:var(--soon)}
.summary.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:820px){.summary.four{grid-template-columns:repeat(2,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--ink3)}
.tile h3{font-size:22px;text-transform:uppercase}
.tile .big{font-family:"Barlow Condensed";font-size:30px;font-weight:700;line-height:1}
.subnav{display:flex;gap:6px;margin:-4px 0 16px}
.subnav a{color:var(--ink)}.subnav a.primary{color:var(--accent-ink)}
a{color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.toolbar input[type=search]{flex:1;min-width:180px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr:first-child td{border-top:0}
table.t tr.low td{background:var(--soon-bg)}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--panel2)}
.qty{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.qty b{min-width:26px;text-align:center}
.qty .btn{padding:1px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;background:var(--na-bg);color:var(--ink2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;max-height:200px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.checkgrid label{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--ink)!important}
.checkgrid input{width:auto!important}
.cl{list-style:none;margin:0;padding:0}
.cl li{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.cl li:first-child{border-top:0}
.cl li input[type=checkbox]{width:19px;height:19px;margin-top:1px;accent-color:var(--accent);flex:none;cursor:pointer}
.cl li .tx{flex:1}
.cl li.done .tx{color:var(--ink3);text-decoration:line-through}
.cl li .when{font-size:12px;color:var(--ink3);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--na-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.rowlist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.rowlist .r{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.rowlist .r:first-child{border-top:0}
.rowlist .r:hover{background:var(--panel2)}
.rowlist .r .what{flex:1;min-width:0}
.rowlist .r .what b{font-weight:600}
.rowlist .r .what .note{display:block}
.seclabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:22px 0 8px;font-weight:600}
/* segmented control (Settings → Appearance) */
.kv.appear{grid-template-columns:auto 1fr}
.seg{display:inline-flex;flex-wrap:nowrap;white-space:nowrap;max-width:100%;overflow-x:auto;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:disabled{cursor:default;opacity:.6}

/* ================= Frosted Glass theme (matches HA "Frosted Glass" / "Frosted Glass Dark" used on Controls) ================= */
:root[data-theme=glass]{
  color-scheme:light;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
  --monofont:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --wall:url("https://cdn.jsdelivr.net/gh/wessamlauf/homeassistant-frosted-glass-themes@refs/heads/main/themes/frosted-glass-light-background.jpg");
  --bg:rgb(254,244,242); --ink:rgba(19,21,54,.98); --ink2:rgba(19,21,54,.8); --ink3:rgba(19,21,54,.45); --line:rgba(19,21,54,.12);
  --accent:rgb(106,116,211); --accent-rgb:106,116,211; --accent-text:rgb(78,88,190); --accent-ink:#fff;
  --edge:rgba(255,255,255,.3); --blur:blur(8px) saturate(1.25);
  --inset:3px 3px .5px -3.5px rgba(255,255,255,.30) inset,-2px -2px .5px -2px rgba(255,255,255,.30) inset,0 0 8px 1px rgba(255,255,255,.10) inset,0 0 2px 0 rgba(0,0,0,.10);
  --depth:0 10px 32px rgba(21,25,45,.12),0 2px 8px rgba(21,25,45,.08);
  --popup:rgba(254,244,242,.35); --scrim:rgba(0,0,0,.38); --menu:rgb(254,244,242); --panel-solid:rgba(254,244,242,.94);
  --panel2:rgba(255,255,255,.32); --btn:rgba(255,255,255,.3); --btn-hover:rgba(255,255,255,.45); --form:rgba(255,255,255,.24); --seg-on:rgba(255,255,255,.6);
  /* theme feedback colors are pastel; darkened here so they stay readable as text on the light glass */
  --ok:rgb(28,122,70); --ok-bg:rgba(118,214,152,.32); --soon:rgb(138,92,0); --soon-bg:rgba(255,219,117,.42); --bad:rgb(178,36,72); --bad-bg:rgba(234,114,135,.26);
  --na:rgba(19,21,54,.75); --na-bg:rgba(255,255,255,.32); --contrast-bg:rgba(254,244,242,.95); --contrast-outline:rgba(19,21,54,.5);
  --panel:transparent; --radius:18px; --shadow:var(--inset),var(--depth);
}
@media (prefers-color-scheme:dark){
  :root[data-theme=glass]:not([data-mode=light]){color-scheme:dark;
    --wall:url("https://cdn.jsdelivr.net/gh/wessamlauf/homeassistant-frosted-glass-themes@refs/heads/main/themes/frosted-glass-dark-background.jpg");
    --bg:rgb(2,6,11); --ink:rgba(234,235,238,.98); --ink2:rgba(234,235,238,.8); --ink3:rgba(234,235,238,.45); --line:rgba(90,111,128,.28);
    --accent:rgb(122,162,190); --accent-rgb:122,162,190; --accent-text:rgb(150,186,210);
    --edge:rgba(234,235,238,.22); --blur:blur(10px) saturate(1.25);
    --inset:3px 3px .5px -3.5px rgba(255,255,255,.30) inset,-2px -2px .5px -2px rgba(255,255,255,.20) inset,0 0 8px 1px rgba(255,255,255,.06) inset,0 0 2px 0 rgba(0,0,0,.18);
    --depth:0 14px 38px rgba(0,0,0,.34),0 2px 10px rgba(0,0,0,.24);
    --popup:rgba(2,6,11,.35); --scrim:rgba(0,0,0,.5); --menu:rgb(2,6,11); --panel-solid:rgba(12,20,30,.92);
    --panel2:rgba(255,255,255,.09); --btn:rgba(255,255,255,.08); --btn-hover:rgba(255,255,255,.14); --form:rgba(12,20,30,.38); --seg-on:rgba(255,255,255,.16);
    --ok:rgb(118,214,152); --ok-bg:rgba(118,214,152,.18); --soon:rgb(255,219,117); --soon-bg:rgba(255,219,117,.16); --bad:rgb(234,114,135); --bad-bg:rgba(234,114,135,.2);
    --na:rgba(234,235,238,.8); --na-bg:rgba(255,255,255,.09); --contrast-bg:rgba(2,6,11,.92); --contrast-outline:rgba(234,235,238,.6);}
}
:root[data-theme=glass][data-mode=dark]{color-scheme:dark;
    --wall:url("https://cdn.jsdelivr.net/gh/wessamlauf/homeassistant-frosted-glass-themes@refs/heads/main/themes/frosted-glass-dark-background.jpg");
    --bg:rgb(2,6,11); --ink:rgba(234,235,238,.98); --ink2:rgba(234,235,238,.8); --ink3:rgba(234,235,238,.45); --line:rgba(90,111,128,.28);
    --accent:rgb(122,162,190); --accent-rgb:122,162,190; --accent-text:rgb(150,186,210);
    --edge:rgba(234,235,238,.22); --blur:blur(10px) saturate(1.25);
    --inset:3px 3px .5px -3.5px rgba(255,255,255,.30) inset,-2px -2px .5px -2px rgba(255,255,255,.20) inset,0 0 8px 1px rgba(255,255,255,.06) inset,0 0 2px 0 rgba(0,0,0,.18);
    --depth:0 14px 38px rgba(0,0,0,.34),0 2px 10px rgba(0,0,0,.24);
    --popup:rgba(2,6,11,.35); --scrim:rgba(0,0,0,.5); --menu:rgb(2,6,11); --panel-solid:rgba(12,20,30,.92);
    --panel2:rgba(255,255,255,.09); --btn:rgba(255,255,255,.08); --btn-hover:rgba(255,255,255,.14); --form:rgba(12,20,30,.38); --seg-on:rgba(255,255,255,.16);
    --ok:rgb(118,214,152); --ok-bg:rgba(118,214,152,.18); --soon:rgb(255,219,117); --soon-bg:rgba(255,219,117,.16); --bad:rgb(234,114,135); --bad-bg:rgba(234,114,135,.2);
    --na:rgba(234,235,238,.8); --na-bg:rgba(255,255,255,.09); --contrast-bg:rgba(2,6,11,.92); --contrast-outline:rgba(234,235,238,.6);}

/* wallpaper: a fixed layer (background-attachment:fixed is ignored on iOS) */
[data-theme=glass] body{background:transparent;font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[data-theme=glass] body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg) var(--wall) center/cover no-repeat}
[data-theme=glass] .mono{font-family:var(--monofont)}
[data-theme=glass] a{color:var(--accent-text)}
[data-theme=glass] a.tile{color:inherit}
[data-theme=glass] a.btn{color:var(--ink)}

/* typography: system font, normal case, medium-weight headings (theme heading weight 500) */
[data-theme=glass] :is(h1,h2,h3){font-family:var(--font);text-transform:none;letter-spacing:0;font-weight:500}
[data-theme=glass] .top h1{font-size:29px;font-weight:700}
[data-theme=glass] .top h1 span{color:var(--accent-text)}

<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>
<script>
/* Home Assistant app runtime: stands in for the claude.use() capabilities the page was written against. */
(function(){
  const enc=encodeURIComponent;
  async function req(method,url,body,type){
    const opt={method,headers:{}};
    if(body!==undefined){ if(body instanceof Blob){opt.body=body;opt.headers["Content-Type"]=type||body.type||"application/octet-stream"} else {opt.body=JSON.stringify(body);opt.headers["Content-Type"]="application/json"} }
    const r=await fetch(url,opt); let j=null; try{ j=await r.json() }catch{}
    if(!r.ok){ const e=new Error((j&&j.error)||("HTTP "+r.status)); e.code=(j&&j.error)||("http_"+r.status); throw e }
    return j;
  }
  const listeners=new Set();
  function snapCol(docs,order){
    let d=docs.map(x=>({id:x.id,data:()=>x.data}));
    if(order){ const [f,dir]=order; d.sort((a,b)=>{const A=a.data()[f]??"",B=b.data()[f]??"";return (A<B?-1:A>B?1:0)*(dir==="desc"?-1:1)}) }
    return {docs:d,metadata:{fromCache:false}};
  }
  async function run(l){
    try{
      if(l.kind==="col"){ const r=await req("GET","api/col?path="+enc(l.path)); if(l.alive) l.cb(snapCol(r.docs,l.order)) }
      else { const r=await req("GET","api/doc?path="+enc(l.path)); if(l.alive) l.cb({exists:r.exists,data:()=>r.data}) }
    }catch(e){ if(l.alive&&l.err) l.err(e) }
  }
  function listen(kind,path,cb,err,order){ const l={kind,path,cb,err,order,alive:true}; listeners.add(l); run(l); return ()=>{l.alive=false;listeners.delete(l)} }
  function matches(l,p){ if(p==="*") return true; if(l.kind==="doc") return p===l.path||l.path.startsWith(p+"/"); const parent=p.split("/").slice(0,-1).join("/"); return parent===l.path||l.path.startsWith(p+"/") }
  let seq=-1, online=true;
  async function poll(){
    for(;;){
      try{
        const r=await req("GET","api/changes?since="+seq+(seq<0?"&wait=0":""));
        if(!online){ online=true; listeners.forEach(run) }
        if(seq>=0){ if(r.paths===null) listeners.forEach(run); else if(r.paths.length) listeners.forEach(l=>{ if(r.paths.some(p=>matches(l,p))) run(l) }) }
        seq=r.seq;
      }catch(e){ online=false; await new Promise(r=>setTimeout(r,3000)) }
    }
  }
  const db={
    doc:p=>({
      set:d=>req("PUT","api/doc?path="+enc(p),d),
      delete:()=>req("DELETE","api/doc?path="+enc(p)),
      get:async()=>{const r=await req("GET","api/doc?path="+enc(p));return {exists:r.exists,data:()=>r.data}},
      onSnapshot:(cb,err)=>listen("doc",p,cb,err)
    }),
    collection:p=>({
      add:d=>req("POST","api/col?path="+enc(p),d),
      orderBy:(f,dir)=>({onSnapshot:(cb,err)=>listen("col",p,cb,err,[f,dir||"asc"])}),
      onSnapshot:(cb,err)=>listen("col",p,cb,err)
    })
  };
  const assets={ upload:async(blob,o)=>{ const r=await req("POST","api/blob",blob,(o&&o.type)||blob.type); return {id:r.id} }, delete:id=>req("DELETE","api/blob/"+enc(id)) };
  poll();
  window.FT={req};
  window.claude={ use: async n=> n==="db"?db : n==="assets"?assets : n==="user"?{can:async()=>true} : null };
})();
</script>
<script>
const SHEET_ID = ""; // Google Sheet sync is not used in the Home Assistant app
const SHEET_TAB = "Vehicle Sheet";
const SOON_DAYS = 60;
const HEADER = ["Year","Make","Model","Trim","Type","VIN","License Plate","Registration Due","Last Oil Change","Next Oil Change","12v Battery Replace","Tire Size","Tires Replaced date","Tires replace mileage","Tires rotated miles","Miles per year est","mileage","purchase date","end loan","Primary Driver","Insurance","Purchase Price"];
const TYPES = ["ICE","EV","Hybrid","Trailer","Watercraft","UTV","Mower","Motorcycle","Other"];
const CATS = ["Oil change","Tires replaced","Tire rotation","12V battery","Registration renewal","Repair","Recall / FSA","Inspection","Other"];

let db=null, mcp=null, assets=null, canWrite=true;
let vehicles=[], meta=null, loaded=false, loadErr=null, staleNote=false;
let route={view:"home"}, editing=false, serviceUnsub=null, serviceList=[], serviceLoaded=false, showAddService=false;
let syncState={status:"idle",at:null,msg:""}, syncTimer=null, syncRunning=false, syncPending=false;
let parts=[], homeTasks=[], equipment=[], checklists=[];
let logUnsub=null, logList=[], logLoaded=false, showAddLog=false;
let pf={q:"",veh:"",kind:"",low:false};
const HOME_SOON=30, SEASON_GRACE=60;
const PART_KINDS=["Part","Fluid","Tool"];
const PART_CATS=["Oil filter","Engine oil","Air filter","Cabin filter","Fuel filter","Spark plugs","Belt","Blades","Battery","Brake parts","Bulbs","Wipers","Gear lube","Coolant","Grease","Tire / wheel","Hardware","Tool","Other"];
const HOME_AREAS=["HVAC","Plumbing","Electrical","Safety","Appliances","Exterior","Yard","Other"];
const SEASONS=["Fall","Winter","Spring","Summer"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const isFull=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"");
const isMonth=v=>/^\d{4}-\d{2}$/.test(v||"");
const isDate=v=>isFull(v)||isMonth(v);
const pad=n=>String(n).padStart(2,"0");
function toDate(v){ if(isFull(v)){const [y,m,d]=v.split("-").map(Number);return new Date(y,m-1,d)} if(isMonth(v)){const [y,m]=v.split("-").map(Number);return new Date(y,m-1,1)} return null }
function dueDate(v){ if(isMonth(v)){const [y,m]=v.split("-").map(Number);return new Date(y,m,0)} return toDate(v) }
function fmt(v){ if(isFull(v)){const d=toDate(v);return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`} if(isMonth(v)){const d=toDate(v);return `${MON[d.getMonth()]} ${d.getFullYear()}`} return v||"" }
function toInput(v){ if(isFull(v)){const [y,m,d]=v.split("-");return `${m}/${d}/${y}`} if(isMonth(v)){const [y,m]=v.split("-");return `${m}/${y}`} return v||"" }
function toSheet(v){ if(isFull(v)){const [y,m,d]=v.split("-").map(Number);return `${m}/${d}/${y}`} if(isMonth(v)){const [y,m]=v.split("-").map(Number);return `${m}/1/${y}`} return v??"" }
function parseDateInput(s){
  s=String(s||"").trim(); if(!s) return "";
  let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=s.match(/^(\d{4})-(\d{1,2})$/)) return `${m[1]}-${pad(m[2])}`;
  if(m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2}|\d{4})$/)){let y=+m[3];if(y<100)y+=2000;if(+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31)return `${y}-${pad(m[1])}-${pad(m[2])}`}
  if(m=s.match(/^(\d{1,2})[\/\-](\d{4}|\d{2})$/)){let y=+m[2];if(y<100)y+=2000;if(+m[1]>=1&&+m[1]<=12)return `${y}-${pad(m[1])}`}
  return s;
}
function parseNum(s){ s=String(s??"").trim().replace(/^\$/,""); if(!s) return ""; const n=Number(s.replace(/,/g,"")); return isFinite(n)&&/^[\d,.\s]+$/.test(s)?n:s }
const fmtNum=v=>typeof v==="number"?v.toLocaleString():(v||"");
function addMonths(v,n){ const d=toDate(v); if(!d) return ""; const t=new Date(d.getFullYear(),d.getMonth()+n,1); if(isMonth(v)) return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(Math.min(d.getDate(),last))}` }
function todayISO(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function daysUntil(d){ const t=new Date();t.setHours(0,0,0,0); return Math.round((d-t)/864e5) }
function rel(days){ if(days===0) return "today"; if(days<0){const a=-days;return a<60?`${a}d overdue`:`${Math.round(a/30)} mo overdue`} return days<60?`in ${days}d`:`in ${Math.round(days/30)} mo` }
const unitOf=v=>v.usageUnit||(["UTV","Mower","Watercraft"].includes(v.type)?"hrs":"mi");
const unitNoun=v=>unitOf(v)==="hrs"?"Hours":"Miles";
const unitCur=v=>unitOf(v)==="hrs"?"hours":"mileage";
const withUnit=(n,v)=>`${n.toLocaleString()} ${unitOf(v)}`;
const vname=v=>[v.year,v.make,v.model].filter(Boolean).join(" ");
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600)}

/* ---------- status logic ---------- */
function regStatus(v){
  const r=v.regDue;
  if(!r||/^na$/i.test(r)) return {key:"na",label:"No registration",short:"—",applies:false};
  if(!isDate(r)) return {key:"na",label:`Registration: ${r}`,short:r,applies:true};
  const d=dueDate(r), days=daysUntil(d);
  const key=days<0?"bad":days<=SOON_DAYS?"soon":"ok";
  return {key,label:`Reg ${fmt(r)}`,short:fmt(r),days,date:d,applies:true,rel:rel(days)};
}
function nextOil(v){
  if(v.oilIntervalMonths>0 && isDate(v.lastOil)) return addMonths(v.lastOil,v.oilIntervalMonths);
  return v.nextOil||"";
}
function oilStatus(v){
  if(!v.oilTracked) return {key:"na",applies:false};
  const n=nextOil(v);
  let days=null, date=null, milesLeft=null, nextMiles=null;
  if(isDate(n)){date=dueDate(n);days=daysUntil(date)}
  if(v.oilIntervalMiles>0 && typeof v.lastOilMiles==="number"){nextMiles=v.lastOilMiles+v.oilIntervalMiles; if(typeof v.mileage==="number") milesLeft=nextMiles-v.mileage}
  if(days===null && milesLeft===null) return {key:"na",label:"Oil: unknown",short:n||"unknown",applies:true};
  const isHrs=unitOf(v)==="hrs";
  const milesSoon=isHrs?Math.max(5,(v.oilIntervalMiles||0)*.1):(v.oilIntervalMiles?Math.max(500,v.oilIntervalMiles*.1):500);
  let key="ok";
  if((days!==null&&days<0)||(milesLeft!==null&&milesLeft<=0)) key="bad";
  else if((days!==null&&days<=SOON_DAYS)||(milesLeft!==null&&milesLeft<=milesSoon)) key="soon";
  const parts=[]; if(date) parts.push(fmt(n)); if(nextMiles) parts.push(withUnit(nextMiles,v));
  return {key,label:`Oil ${parts.join(" / ")}`,short:parts.join(" or "),days,date,milesLeft,nextMiles,next:n,applies:true,rel:days!==null?rel(days):(milesLeft<=0?`${withUnit(-milesLeft,v)} over`:`${withUnit(milesLeft,v)} left`)};
}
const ICON={
 car:'<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 28v-7l6-10h28l10 10h6v7"/><circle cx="17" cy="30" r="5"/><circle cx="47" cy="30" r="5"/><path d="M22 30h20M2 28h4"/></svg>',
 trailer:'<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 26h44V12H4zM48 22h12"/><circle cx="20" cy="30" r="5"/><circle cx="32" cy="30" r="5"/></svg>',
 boat:'<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 22h56l-8 10H12z"/><path d="M18 22l6-10h14l6 10"/><path d="M2 36c6 0 6-2 12-2s6 2 12 2 6-2 12-2 6 2 12 2 6-2 12-2"/></svg>',
 utv:'<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 26l4-14h22l4 8h14l4 6"/><path d="M14 12l4-6h14"/><circle cx="16" cy="29" r="6"/><circle cx="48" cy="29" r="6"/></svg>',
 mower:'<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 26h40l4-8H30l-4-8h-8l-2 8h-6z"/><circle cx="16" cy="30" r="5"/><circle cx="46" cy="30" r="4"/></svg>'
};
function iconFor(t){t=(t||"").toLowerCase(); if(t.includes("trailer"))return ICON.trailer; if(t.includes("water")||t.includes("boat"))return ICON.boat; if(t.includes("utv"))return ICON.utv; if(t.includes("mower"))return ICON.mower; return ICON.car}
const photoHTML=v=>v.photoId?`<img src="_blob/${esc(v.photoId)}" alt="${esc(vname(v))}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:iconFor('${esc(v.type)}')}))">`:iconFor(v.type);

/* ---------- render ---------- */
function render(){
  const app=$("#app");
  if(!loaded){ app.innerHTML=`<div class="loading">${loadErr?esc(loadErr):staleNote?"Still trying to reach your tracker data…":"Loading…"}</div>`; return; }
  if(route.view==="vehicle"){ const v=vehicles.find(x=>x.id===route.id); if(v) return renderDetail(v); }
  if(route.view==="task"){ const t=homeTasks.find(x=>x.id===route.id); if(t) return renderTask(t); }
  if(route.view==="list"){ const c=checklists.find(x=>x.id===route.id); if(c) return renderList(c); }
  if(route.view==="garage") return renderHome();
  if(route.view==="parts") return renderParts();
  if(route.view==="home") return renderHomeTab();
  if(route.view==="seasonal") return renderSeasonal();
  if(route.view==="settings") return renderSettings();
  if(["vehicle","task","list"].includes(route.view)){ $("#app").innerHTML=`${topHTML("")}<div class="note">That item isn't here anymore. <a href="#">Back to overview</a></div>`; return }
  renderOverview();
}
/* ---------- tracker-wide status ---------- */
function taskNext(t){ if(t.intervalMonths>0 && isDate(t.lastDone)) return addMonths(t.lastDone,t.intervalMonths); return isDate(t.nextDue)?t.nextDue:"" }
function taskStatus(t){
  const n=taskNext(t);
  if(!isDate(n)) return {key:"na",short:isDate(t.lastDone)?"No interval set":"Not logged yet",applies:true,rel:""};
  const days=daysUntil(dueDate(n));
  return {key:days<0?"bad":days<=HOME_SOON?"soon":"ok",short:fmt(n),days,next:n,applies:true,rel:rel(days)};
}
function listCycle(c){
  const now=new Date(); now.setHours(0,0,0,0);
  const s=+c.startMonth||1, d=+c.dueMonth||s;
  let ws=new Date(now.getFullYear(),s-1,1); if(ws>now) ws=new Date(now.getFullYear()-1,s-1,1);
  const due=new Date(ws.getFullYear()+(d<s?1:0),d,0);
  const nextWs=new Date(ws.getFullYear()+1,s-1,1);
  return {ws,due,nextWs};
}
const itemDone=(it,cy)=>!!(it.doneAt&&isDate(it.doneAt)&&toDate(it.doneAt)>=cy.ws);
function listStatus(c){
  const cy=listCycle(c), items=c.items||[];
  const nDone=items.filter(it=>itemDone(it,cy)).length;
  const complete=(c.completedAt&&isDate(c.completedAt)&&toDate(c.completedAt)>=cy.ws)||(items.length>0&&nDone===items.length);
  const days=daysUntil(cy.due);
  const dueIso=`${cy.due.getFullYear()}-${pad(cy.due.getMonth()+1)}-${pad(cy.due.getDate())}`;
  const nextLbl=`${MON[cy.nextWs.getMonth()]} ${cy.nextWs.getFullYear()}`;
  if(complete) return {key:"ok",short:"Done for "+seasonLabel(c,cy),days,cy,nDone,total:items.length,rel:"next "+nextLbl,applies:true,complete:true};
  if(days>=0) return {key:"soon",short:"Due by "+fmt(dueIso),days,cy,nDone,total:items.length,rel:rel(days),applies:true,open:true};
  if(days>=-SEASON_GRACE) return {key:"bad",short:"Was due "+fmt(dueIso),days,cy,nDone,total:items.length,rel:rel(days),applies:true,open:true};
  return {key:"na",short:"Opens "+nextLbl,days,cy,nDone,total:items.length,rel:"",applies:true,idle:true};
}
function seasonLabel(c,cy){ return `${c.season||""} ${cy.ws.getFullYear()}`.trim() }
const partLow=p=>typeof p.qty==="number"&&typeof p.minQty==="number"&&p.qty<=p.minQty;
function warrantyStatus(e){
  if(!isDate(e.warrantyEnds)) return null;
  const days=daysUntil(dueDate(e.warrantyEnds));
  if(days<0) return {key:"na",short:"Warranty ended "+fmt(e.warrantyEnds),days};
  return {key:days<=60?"soon":"ok",short:"Warranty to "+fmt(e.warrantyEnds),days,rel:rel(days)};
}
function allDue(){
  const out=[];
  for(const v of vehicles.filter(v=>v.status!=="gone")) for(const [kind,s] of [["Registration",regStatus(v)],["Oil change",oilStatus(v)]]) if(s.applies&&(s.key==="bad"||s.key==="soon")) out.push({sec:"Garage",go:"v-"+v.id,title:vname(v),what:`${kind}: ${s.short}`,s});
  for(const t of homeTasks.filter(t=>t.status!=="archived")){ const s=taskStatus(t); if(s.key==="bad"||s.key==="soon") out.push({sec:"Home",go:"h-"+t.id,title:t.name,what:`Due ${s.short}`,s}) }
  for(const c of checklists){ const s=listStatus(c); if(s.key==="bad"||s.key==="soon") out.push({sec:"Seasonal",go:"s-"+c.id,title:c.name,what:`${s.short} · ${s.nDone}/${s.total} done`,s}) }
  for(const e of equipment){ const s=warrantyStatus(e); if(s&&s.key==="soon") out.push({sec:"Home",go:"home",title:e.name,what:s.short,s}) }
  out.sort((a,b)=>(a.s.key==="bad"?0:1)-(b.s.key==="bad"?0:1)||((a.s.days??-1e9)-(b.s.days??-1e9)));
  return out;
}

/* ---------- actions ---------- */
async function writeVehicle(id,data){
  if(!db) throw new Error("Database unavailable");
  await db.doc(`vehicles/${id}`).set(data);
  queueSync();
}
function collectEdits(v){
  const out={...v}; delete out.id;
  document.querySelectorAll("[data-f]").forEach(el=>{
    const k=el.dataset.f;
    if(el.type==="checkbox") out[k]=el.checked;
    else if(el.dataset.kind==="date") out[k]=parseDateInput(el.value);
    else if(el.dataset.kind==="num") out[k]=parseNum(el.value);
    else out[k]=el.value.trim();
  });
  ["year","oilIntervalMonths","oilIntervalMiles"].forEach(k=>{ if(typeof out[k]!=="number") out[k]=out[k]===""?"":out[k] });
  return out;
}
async function saveEdits(){
  const v=vehicles.find(x=>x.id===route.id); if(!v) return;
  const data=collectEdits(v);
  try{ await writeVehicle(v.id,data); editing=false; toast("Saved"); render(); }
  catch(e){ toast("Save failed: "+(e.message||e.code||"unknown")) }
}
async function saveService(form){
  const v=vehicles.find(x=>x.id===route.id); if(!v) return;
  const f=new FormData(form);
  const entry={date:parseDateInput(f.get("date")),category:f.get("category"),mileage:parseNum(f.get("mileage")),title:String(f.get("title")||"").trim(),details:String(f.get("details")||"").trim(),shop:String(f.get("shop")||"").trim(),createdAt:new Date().toISOString()};
  const c=parseNum(String(f.get("cost")||"").replace(/\$/g,"")); if(c!=="") entry.cost=c;
  if(!isDate(entry.date)){toast("Enter a date like 11/14/2026");return}
  form.querySelector("button[type=submit]").disabled=true;
  try{
    await db.collection(`vehicles/${v.id}/service`).add(entry);
    const upd={...v}; delete upd.id; let changed=false;
    const mi=typeof entry.mileage==="number"?entry.mileage:null;
    if(mi&&(typeof v.mileage!=="number"||mi>v.mileage)){upd.mileage=mi;changed=true}
    const newer=(cur)=>!isDate(cur)||entry.date>=cur;
    if(entry.category==="Oil change"&&newer(v.lastOil)){upd.lastOil=entry.date;if(mi)upd.lastOilMiles=mi;upd.oilTracked=true;changed=true}
    if(entry.category==="Tires replaced"&&newer(v.tiresReplacedDate)){upd.tiresReplacedDate=entry.date;if(mi)upd.tiresReplacedMiles=mi;changed=true}
    if(entry.category==="Tire rotation"&&mi){upd.tiresRotatedMiles=mi;changed=true}
    if(entry.category==="12V battery"&&newer(v.battery)){upd.battery=entry.date;changed=true}
    if(entry.category==="Registration renewal"){const nr=parseDateInput(f.get("newReg"));if(isDate(nr)){upd.regDue=nr;changed=true}}
    if(changed) await writeVehicle(v.id,upd);
    showAddService=false; toast(changed?"Logged and vehicle updated":"Logged"); render();
  }catch(e){ toast("Couldn't save entry: "+(e.message||e.code)); form.querySelector("button[type=submit]").disabled=false }
}
async function resizeImage(file){
  try{
    const bmp=await createImageBitmap(file); const max=1800; const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.86));
  }catch{ return file }
}
async function uploadPhoto(file){
  const v=vehicles.find(x=>x.id===route.id); if(!v||!assets) return;
  toast("Uploading photo…");
  try{
    const blob=await resizeImage(file);
    const type=["image/jpeg","image/png","image/webp","image/gif"].includes(blob.type)?blob.type:"image/jpeg";
    const res=await assets.upload(blob,{type});
    const upd={...v}; delete upd.id; upd.photoId=res.id;
    await db.doc(`vehicles/${v.id}`).set(upd);
    toast("Photo saved");
  }catch(e){ toast(e.code==="too_large"?"That photo is too large":e.code==="unsupported_type"?"Use a JPG, PNG or WebP photo":"Upload failed: "+(e.message||e.code)) }
}
async function removePhoto(){
  const v=vehicles.find(x=>x.id===route.id); if(!v) return;
  const id=v.photoId; const upd={...v}; delete upd.id; delete upd.photoId;
  try{ await db.doc(`vehicles/${v.id}`).set(upd); if(assets&&id) assets.delete(id).catch(()=>{}); toast("Photo removed") }catch(e){ toast("Couldn't remove: "+(e.message||e.code)) }
}
function modal(html,onSubmit){
  const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="box">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{ if(e.target===m||e.target.dataset.close!==undefined) m.remove() });
  const form=m.querySelector("form"); form&&form.addEventListener("submit",async e=>{e.preventDefault(); const ok=await onSubmit(new FormData(form)); if(ok!==false) m.remove()});
  const first=m.querySelector("input"); first&&first.focus();
}

function partMatches(p){
  if(pf.veh&&!(p.fits||[]).includes(pf.veh)) return false;
  if(pf.kind&&(p.kind||"Part")!==pf.kind) return false;
  if(pf.low&&!partLow(p)) return false;

}

async function bumpQty(id,d){
  const p=parts.find(x=>x.id===id); if(!p) return;
  const q=Math.max(0,(typeof p.qty==="number"?p.qty:0)+d);
  const upd={...p}; delete upd.id; upd.qty=q; upd.updatedAt=new Date().toISOString();
  p.qty=q; refreshPartsTable(); if(route.view==="vehicle") render();
  try{ await db.doc(`parts/${id}`).set(upd); if(partLow(upd)&&d<0) toast(`${p.name}: ${q} left — time to restock`) }catch(e){ toast("Couldn't update: "+(e.message||e.code)) }
}

function sheetRow(v){
  const n=nextOil(v);
  const ins=[v.insuranceCarrier,v.insurancePolicy].filter(Boolean).join(" ");
  return [v.year??"",v.make??"",v.model??"",v.trim??"",v.type??"",v.vin??"",v.plate??"",toSheet(v.regDue),toSheet(v.lastOil),toSheet(n),toSheet(v.battery),v.tireSize??"",toSheet(v.tiresReplacedDate),v.tiresReplacedMiles??"",v.tiresRotatedMiles??"",v.milesPerYear??"",v.mileage??"",toSheet(v.purchaseDate),toSheet(v.endLoan),v.driver??"",ins,v.purchasePrice??""].map(x=>x===undefined||x===null?"":x);
}
function buildSheet(){
  const W=23, blank=()=>Array(W).fill("");
  const stamp="App sync: "+new Date().toLocaleString();
  const rows=[[...HEADER,stamp]];
  const active=vehicles.filter(v=>v.status!=="gone").sort((a,b)=>(a.order??0)-(b.order??0));
  const gone=vehicles.filter(v=>v.status==="gone").sort((a,b)=>(a.order??0)-(b.order??0));
  active.forEach(v=>rows.push([...sheetRow(v),""]));
  rows.push(blank()); const g=blank(); g[0]="GONE!"; rows.push(g);
  gone.forEach(v=>rows.push([...sheetRow(v),""]));
  rows.push(blank(),blank());
  (meta?.footer||[]).forEach(r=>{const x=blank(); r.forEach((c,i)=>x[i]=c); rows.push(x)});
  const used=rows.length; const total=Math.max(used,meta?.lastRows||used);
  while(rows.length<total) rows.push(blank());
  return {rows,used};
}
function queueSync(){ /* Google Sheet sync is not used in the Home Assistant app */ }
async function runSync(){
  if(!mcp){ syncState={status:"off"}; render(); return }
  if(syncRunning){ syncPending=true; return }
  syncRunning=true; syncState={...syncState,status:"busy"}; updateSyncUI();
  try{
    const {rows,used}=buildSheet();
    await mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET_ID,range:`'${SHEET_TAB}'!A1:W${rows.length}`,values:rows});
    if(db&&meta&&meta.lastRows!==used){ meta={...meta,lastRows:used}; await db.doc("meta/sheet").set(meta).catch(()=>{}) }
    syncState={status:"ok",at:Date.now()};
  }catch(e){
    const m={needs_reauth:"Reconnect Google Sheets in Settings → Connectors",server_not_connected:"Add the Google Sheets connector to sync",not_in_manifest:"Sheet sync not allowed for this page",approval_required:"Sheet sync needs your approval — click Retry",blocked_by_policy:"Sheet sync blocked by policy"}[e.code];
    syncState={status:"error",msg:m||("Sheet sync failed"+(e.code==="tool_error"&&e.message?": "+String(e.message).slice(0,80):"")+" — saved here, click Retry")};
  }
  syncRunning=false; updateSyncUI();
  if(syncPending){ syncPending=false; queueSync() }
}
function updateSyncUI(){ const el=document.querySelector(".sync"); if(el) el.outerHTML=syncHTML() }

    if(act==="appearance"){
      const prev=appearance, next={...appearance,[a.dataset.k]:a.dataset.v};
      applyAppearance(next); if(route.view==="settings") render();
      db.doc("meta/appearance").set(appearance).catch(err=>{ applyAppearance(prev); if(route.view==="settings") render(); toast("Couldn't save: "+(err.message||err.code)) });
    }
    else if(act==="home"){ location.hash=""; }
    else if(act==="garage"){ location.hash="garage" }
    else if(act==="publish"){ FT.req("POST","api/publish").then(()=>refreshStatus()).then(()=>{toast("Sensors updated"); if(route.view==="settings") render()}).catch(e=>toast("Failed: "+e.message)) }
    else if(act==="remindnow"){ a.disabled=true; FT.req("POST","api/remind").then(r=>{ toast(r.sent?"Reminder sent":r.due?"Couldn't send — see Last check":"Nothing is due right now"); return refreshStatus() }).then(()=>{ if(route.view==="settings") render() }).catch(e=>{ toast("Failed: "+e.message); a.disabled=false }) }
    else if(act==="copycal"){ const i=$("#calurl"); i.select(); (navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).then(()=>toast("Copied"),()=>toast("Select the URL and copy it")) }
    else if(act==="hometab"){ location.hash="home" }
    else if(act==="seasontab"){ location.hash="seasonal" }
    else if(act==="addpart"){ partDialog(null,a.dataset.veh) }
    else if(act==="editpart"){ partDialog(parts.find(x=>x.id===a.dataset.id)) }
    else if(act==="delpart"){ const p=parts.find(x=>x.id===a.dataset.id); confirmDelete(p?.name||"this item",()=>db.doc(`parts/${a.dataset.id}`).delete()) }
    else if(act==="qty"){ e.stopPropagation(); bumpQty(a.dataset.id,+a.dataset.d) }
    else if(act==="addtask"){ taskDialog() }
    else if(act==="edittask"){ taskDialog(homeTasks.find(x=>x.id===a.dataset.id)) }
    else if(act==="deltask"){ const t=homeTasks.find(x=>x.id===a.dataset.id); confirmDelete(t?.name||"this task",async()=>{ await db.doc(`home/${a.dataset.id}`).delete(); if(route.view==="task") location.hash="home" }) }
    else if(act==="taskdone"){ e.stopPropagation(); quickDone(a.dataset.id) }
    else if(act==="newlog"){ showAddLog=true; render(); document.getElementById("logform")?.scrollIntoView({behavior:"smooth",block:"center"}) }
    else if(act==="cancellog"){ showAddLog=false; render() }
    else if(act==="dellog"){ const t=homeTasks.find(x=>x.id===route.id); const sid=a.dataset.id; confirmDelete("this entry",()=>db.doc(`home/${t.id}/log/${sid}`).delete()) }
    else if(act==="addequip"){ equipDialog() }
    else if(act==="delequip"){ const q=equipment.find(x=>x.id===a.dataset.id); confirmDelete(q?.name||"this equipment",()=>db.doc(`equipment/${a.dataset.id}`).delete()) }
    else if(act==="addlist"){ listDialog() }
    else if(act==="editlist"){ listDialog(checklists.find(x=>x.id===route.id)) }
    else if(act==="dellist"){ const c=checklists.find(x=>x.id===route.id); confirmDelete(c?.name||"this checklist",async()=>{ await db.doc(`checklists/${c.id}`).delete(); location.hash="seasonal" }) }
    else if(act==="completelist"){ const c=checklists.find(x=>x.id===route.id); const t=todayISO(), cy=listCycle(c); writeList(c,{completedAt:t,items:(c.items||[]).map(it=>itemDone(it,cy)?it:{...it,doneAt:t})}).then(()=>toast("Marked done for the season")).catch(err=>toast("Failed: "+(err.message||err.code))) }
    else if(act==="reopenlist"){ const c=checklists.find(x=>x.id===route.id); writeList(c,{completedAt:"",items:(c.items||[]).map(it=>({...it,doneAt:""}))}).catch(err=>toast("Failed: "+(err.message||err.code))) }
    else if(act==="delitem"){ const c=checklists.find(x=>x.id===route.id); writeList(c,{items:(c.items||[]).filter(it=>it.id!==a.dataset.id)}).catch(err=>toast("Failed: "+(err.message||err.code))) }
    else if(act==="edit"){ editing=true; render() }
    else if(act==="cancel"){ editing=false; render() }
    else if(act==="save"){ saveEdits() }
    else if(act==="newservice"){ showAddService=true; render(); document.getElementById("svcform")?.scrollIntoView({behavior:"smooth",block:"center"}) }
    else if(act==="cancelservice"){ showAddService=false; render() }
    else if(act==="delservice"){ delService(a.dataset.id) }
    else if(act==="sync"){ runSync() }
    else if(act==="add"){ addVehicleDialog() }
    else if(act==="gone"){ goneDialog() }
    else if(act==="reactivate"){ reactivate() }
    else if(act==="rmphoto"){ removePhoto() }
    return;
  }
  if(g){ location.hash="v-"+g.dataset.go; return }
  const ed=e.target.closest("[data-edit]"); if(ed&&canWrite){ partDialog(parts.find(x=>x.id===ed.dataset.edit)); return }
  const eq=e.target.closest("[data-equip]"); if(eq&&canWrite){ equipDialog(equipment.find(x=>x.id===eq.dataset.equip)); return }
  const h=e.target.closest("[data-hash]"); if(h&&!e.target.closest("a")){ location.hash=h.dataset.hash }
});
document.addEventListener("input",e=>{ if(e.target.id==="pq"){ pf.q=e.target.value; refreshPartsTable() } });
document.addEventListener("change",e=>{
  if(e.target.matches('input[data-act="photo"]')&&e.target.files[0]) uploadPhoto(e.target.files[0]);
  if(e.target.matches('input[data-act="importfile"]')&&e.target.files[0]){ importBackup(e.target.files[0]); e.target.value="" }
  if(e.target.id==="pveh"){ pf.veh=e.target.value; refreshPartsTable() }
  if(e.target.id==="pkind"){ pf.kind=e.target.value; refreshPartsTable() }
  if(e.target.id==="plow"){ pf.low=e.target.checked; refreshPartsTable() }
  if(e.target.dataset&&e.target.dataset.act==="toggleitem"){ toggleItem(e.target.dataset.id,e.target.checked) }
  if(e.target.name==="category"){ const w=document.getElementById("newregwrap"); if(w) w.style.display=e.target.value==="Registration renewal"?"flex":"none" }
});
function imageFromList(items){ for(const it of items||[]){ const f=it.kind?(it.kind==="file"&&it.type.startsWith("image/")?it.getAsFile():null):(it.type&&it.type.startsWith("image/")?it:null); if(f) return f } return null }
document.addEventListener("paste",e=>{
  if(route.view!=="vehicle"||!assets||!canWrite) return;
  const f=imageFromList(e.clipboardData&&e.clipboardData.items);
  if(f){ e.preventDefault(); uploadPhoto(f); return }
  const t=e.target; const inField=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA");
  if(!inField&&e.clipboardData&&/<img/i.test(e.clipboardData.getData("text/html")||"")) toast("That copied a web link, not the image. Right-click the picture → Copy image, then paste.");
});
document.addEventListener("dragover",e=>{ const ph=e.target.closest&&e.target.closest("#heroph"); if(ph&&assets&&canWrite){ e.preventDefault(); ph.classList.add("drop") } });
document.addEventListener("dragleave",e=>{ const ph=e.target.closest&&e.target.closest("#heroph"); if(ph) ph.classList.remove("drop") });
document.addEventListener("drop",e=>{ const ph=e.target.closest&&e.target.closest("#heroph"); if(!ph||!assets||!canWrite) return; e.preventDefault(); ph.classList.remove("drop"); const f=imageFromList(e.dataTransfer&&e.dataTransfer.files); if(f) uploadPhoto(f); else toast("Drop an image file") });
document.addEventListener("submit",e=>{
  if(e.target.id==="svcform"){ e.preventDefault(); saveService(e.target) }
  if(e.target.id==="logform"){ e.preventDefault(); saveLog(e.target) }
  if(e.target.id==="additem"){ e.preventDefault(); const c=checklists.find(x=>x.id===route.id); const text=String(new FormData(e.target).get("text")||"").trim(); if(c&&text) writeList(c,{items:[...(c.items||[]),{id:"i"+Date.now().toString(36),text,doneAt:""}]}).then(()=>document.querySelector('#additem input')?.focus()).catch(err=>toast("Failed: "+(err.message||err.code))) }
});
function applyRoute(){
  const h=location.hash.replace(/^#/,"");
  const prev=route.id;
  route=h.startsWith("v-")?{view:"vehicle",id:h.slice(2)}:h.startsWith("h-")?{view:"task",id:h.slice(2)}:h.startsWith("s-")?{view:"list",id:h.slice(2)}:["garage","parts","home","seasonal","settings"].includes(h)?{view:h}:{view:"overview"};
  if(route.id!==prev){ editing=false; showAddService=false; showAddLog=false; subscribeService(); subscribeLog() }
  document.querySelector(".modal")?.remove();
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",applyRoute);
function subscribeLog(){
  if(logUnsub){ logUnsub(); logUnsub=null }
  logList=[]; logLoaded=false;
  if(!db||route.view!=="task") return;
  logUnsub=db.collection(`home/${route.id}/log`).orderBy("date","desc").onSnapshot(s=>{ logList=s.docs.map(d=>({id:d.id,...d.data()})); logLoaded=true; if(!document.querySelector(".modal")&&!document.getElementById("logform")) render() },()=>{ logLoaded=true; render() });
}
function subscribeService(){
  if(serviceUnsub){ serviceUnsub(); serviceUnsub=null }
  serviceList=[]; serviceLoaded=false;
  if(!db||route.view!=="vehicle") return;
  serviceUnsub=db.collection(`vehicles/${route.id}/service`).orderBy("date","desc").onSnapshot(s=>{
    serviceList=s.docs.map(d=>({id:d.id,...d.data()})); serviceLoaded=true; if(!editing) render(); else { const l=document.querySelector(".log"); if(l){const cv=vehicles.find(x=>x.id===route.id); l.innerHTML=serviceList.map(e=>entryHTML(e,cv)).join("")||'<div class="note">No service entries yet.</div>'} }
  },()=>{ serviceLoaded=true; render() });
}

/* ---------- boot ---------- */
(async()=>{
  applyRoute();
  db=await claude.use("db");
  if(!db){ loadErr="Can't reach the tracker service."; render(); return }
  const user=await claude.use("user");
  if(user){ try{ const w=await user.can("data.write"); if(w===false) canWrite=false }catch{} }
  claude.use("assets").then(a=>{ assets=a; render() });
  refreshStatus(); setInterval(refreshStatus,60000);
  const timer=setTimeout(()=>{ staleNote=true; render() },10000);
  db.doc("meta/sheet").onSnapshot(s=>{ meta=s.exists?s.data():{footer:[],lastRows:0} },()=>{});
  db.doc("meta/appearance").onSnapshot(s=>{
    const before=appearance.theme+appearance.mode; applyAppearance(s.exists?s.data():null);
    if(route.view==="settings"&&before!==appearance.theme+appearance.mode&&!document.querySelector(".modal")) render();
  },()=>{});
  db.collection("vehicles").onSnapshot(s=>{
    vehicles=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!s.metadata.fromCache){ clearTimeout(timer); staleNote=false }
    loaded=true;
    if(!editing && !document.querySelector(".modal")) render();
  },err=>{ clearTimeout(timer); loaded=true; loadErr=null; staleNote=true; render() });
  if(route.view==="vehicle") subscribeService();
  if(route.view==="task") subscribeLog();
  const quietRender=()=>{ if(!loaded||editing||document.querySelector(".modal")) return; if(route.view==="parts"&&document.activeElement&&document.activeElement.id==="pq") return refreshPartsTable(); render() };
  db.collection("parts").onSnapshot(s=>{ parts=s.docs.map(d=>({id:d.id,...d.data()})); quietRender() },()=>{});
  db.collection("home").onSnapshot(s=>{ homeTasks=s.docs.map(d=>({id:d.id,...d.data()})); quietRender() },()=>{});
  db.collection("equipment").onSnapshot(s=>{ equipment=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.area).localeCompare(String(b.area))||String(a.name).localeCompare(String(b.name))); quietRender() },()=>{});
  db.collection("checklists").onSnapshot(s=>{ checklists=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0)); quietRender() },()=>{});
})();
</script>
</body>
</html>
